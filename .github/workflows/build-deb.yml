name: Build and publish deb

# Rolling release: every GREEN push to main builds fpgas-online-tt and
# publishes it to the fpgas-online/apt repository via repository_dispatch.
# The package is Architecture: all (pure Python), so it builds on the
# default runner and installs on any Debian arch. The version is
# git-derived (vX.Y.Z at a tag, vX.Y.Z.postN after it).
#
# Gated on CI: triggered when the "CI" workflow completes for main, and the
# build/publish jobs only proceed when that run succeeded, so a red commit
# never reaches the apt repo. push:tags stays for cutting a new series
# directly, and workflow_dispatch for manual re-runs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # workflow_run fires on every completion (failure/cancelled too); only a
    # successful CI run is a release. publish inherits the skip via needs.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the SHA CI validated, not the default-branch HEAD (which a
          # workflow_run checkout would otherwise use and may already be past).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # full history + tags so deb-version.py can describe

      - name: Install nfpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo goreleaser/nfpm --pattern 'nfpm_*_Linux_x86_64.tar.gz' --dir .
          tar xzf nfpm_*.tar.gz nfpm
          chmod +x nfpm

      - name: Build deb (arch all)
        id: version
        run: |
          VERSION="$(python3 packaging/deb-version.py)"
          export VERSION
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          ./nfpm package --packager deb --target dist/
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  publish:
    needs: build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # If APT_REPO_TOKEN is unset, repository-dispatch fails visibly here
      # (rather than being silently gated away) -- see README.md "Releases
      # (rolling)" for what the secret needs and how to create it.
      - name: Trigger apt repo update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.APT_REPO_TOKEN }}
          repository: fpgas-online/apt
          event-type: receive-deb
          client-payload: |
            {
              "package_name": "fpgas-online-tt",
              "package_version": "${{ needs.build.outputs.version }}",
              "run_id": "${{ github.run_id }}",
              "source_repo": "${{ github.repository }}"
            }
