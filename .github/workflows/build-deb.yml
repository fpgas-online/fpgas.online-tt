name: Build and publish deb

# Rolling release: every GREEN push to main builds fpgas-online-tt and
# publishes it as an asset on the rolling "debs" GitHub Release. No tokens
# involved: the fpgas-online/apt repo polls that release and pulls in any
# asset it does not yet have. The package is Architecture: all (pure
# Python), so it builds on the default runner and installs on any Debian
# arch. The version is git-derived (vX.Y.Z at a tag, vX.Y.Z.postN after it).
#
# Gated on CI: triggered when the "CI" workflow completes for main, and the
# publish step only runs when that run succeeded, so a red commit never
# reaches the release. push:tags stays for cutting a new series directly,
# and workflow_dispatch for manual re-runs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create/update the "debs" GitHub Release with GITHUB_TOKEN

jobs:
  build:
    # workflow_run fires on every completion (failure/cancelled too); only a
    # successful CI run is a release.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the SHA CI validated, not the default-branch HEAD (which a
          # workflow_run checkout would otherwise use and may already be past).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # full history + tags so deb-version.py can describe

      - name: Install nfpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo goreleaser/nfpm --pattern 'nfpm_*_Linux_x86_64.tar.gz' --dir .
          tar xzf nfpm_*.tar.gz nfpm
          chmod +x nfpm

      - name: Build deb (arch all)
        run: |
          VERSION="$(python3 packaging/deb-version.py)"
          export VERSION
          echo "VERSION=$VERSION"
          mkdir -p dist
          ./nfpm package --packager deb --target dist/
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

      - name: Publish deb to the rolling "debs" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One rolling pre-release, tag "debs" pinned to the root commit forever (never moved);
          # every build appends its versioned asset. The fpgas-online/apt repo polls this
          # release and pulls any asset it does not yet have into its pool.
          ROOT="$(git rev-list --max-parents=0 HEAD | tail -1)"
          if ! gh release view debs >/dev/null 2>&1; then
            gh release create debs --target "$ROOT" --prerelease \
              --title "Debian packages (rolling)" \
              --notes "Rolling .deb builds of fpgas-online-tt, one asset per green commit on main (version from git describe). Consumed by https://github.com/fpgas-online/apt."
          fi
          gh release upload debs dist/*.deb --clobber
          echo "Published: $(ls dist/*.deb)"
