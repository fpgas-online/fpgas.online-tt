name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run pytest -v

  # The Pi runtime is bookworm: python3.11 + the distro's aiohttp 3.8.4 /
  # pyserial-asyncio 0.6. `uv sync` resolves much newer wheels, so pin the
  # deployed versions here and run the same suite against them.
  test-bookworm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install bookworm-pinned dependencies
        run: |
          uv venv --python 3.11 .venv-bookworm
          uv pip install --python .venv-bookworm \
            "aiohttp==3.8.4" "pyserial-asyncio==0.6" "PyYAML>=6,<7" \
            "pytest>=8" "pytest-aiohttp>=1.0" "pytest-asyncio>=0.23" -e .
      - run: .venv-bookworm/bin/python -m pytest -v

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so deb-version.py can describe
      - name: Install nfpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo goreleaser/nfpm --pattern 'nfpm_*_Linux_x86_64.tar.gz' --dir .
          tar xzf nfpm_*.tar.gz nfpm
          chmod +x nfpm
      - name: Build deb
        run: |
          VERSION="$(python3 packaging/deb-version.py)"
          export VERSION
          echo "VERSION=$VERSION"
          mkdir -p dist && ./nfpm package --packager deb --target dist/
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package-pr
          path: dist/*.deb
