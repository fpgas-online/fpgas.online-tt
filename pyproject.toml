[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpgas-online-tt"
version = "0.1.0"
description = "Pi-side Tiny Tapeout demo-board bridge daemon for fpgas.online"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.8",
    "pyserial-asyncio>=0.6",
    "PyYAML>=6",
]

[project.scripts]
fpgas-tt = "fpgas_tt.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fpgas_tt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error", "ignore::aiohttp.web_exceptions.NotAppKeyWarning"]
